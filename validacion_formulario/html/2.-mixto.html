<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/estilos_nativos.css">
</head>
<body>
    <header>
        <h3>Validacion de formularios NATIVA + JS (MIXTA)</h3>
    </header>
    <main>
        <!--
        etiquetas para realizar una validacion nativa
        required
        autocomplete 
        pattern
        min
        max
        maxlength
        minlength
        -->
        <form action="#" method="POST">
            <label for="name">Nombre</label>
            <input type="name" id="nombre" name="nombre" required><br>

            <label for="email">Correo</label>
            <input type="email" id="correo" name="correo" autocomplete="new-password"><br>

            <label for="password">Contraseña</label>
            <input type="password" id="clave" name="clave"><br>

            <label for="tlf">Telefono</label>
            <input type="text" id="tlf" name="tlf" pattern="\d{3} \d{3} \d{3}"><br>

            <label for="age">Edad</label>
            <input type="text" id="age" name="age" min="18" max="99"><br>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
