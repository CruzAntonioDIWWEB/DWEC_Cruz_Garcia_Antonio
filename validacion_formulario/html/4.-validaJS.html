<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/estilos_JS.css">
    <script src="../js/4.-validar_soloJS.js" defer></script>
</head>
<body>
    <header>
        <h3>Validacion de formularios JS + </h3>
    </header>
    <main>
        <form action="#" method="POST" novalidate> <!--se introduce el NOVALIDATE en el formulario-->
            <label for="name">Nombre</label>
            <input type="name" id="name" name="name" required maxlength="8"><br>
            <p id="errorname" class="oculto error"></p>

            <label for="email">Correo</label>
            <input type="email" id="email" name="email" autocomplete="new-password"><br>
            <p id="erroremail" class="oculto error"></p>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"><br>
            <p id="errorpassword" class="oculto error"></p>

            <label for="confirm-password">Repita la contraseña</label>
            <input type="password" id="confirm-password" name="confirm-password"><br>
            <p id="errorconfirm-password" class="oculto error"></p>

            <label for="tlf">Telefono</label>
            <input type="text" id="tlf" name="tlf" pattern="\d{3} \d{3} \d{3}"><br>
            <p id="errortlf" class="oculto error"></p>

            <label for="age">Edad</label>
            <input type="text" id="age" name="age" min="18" max="99"><br>
            <p id="errorage" class="oculto error"></p>

            <button type="submit">Enviar</button>
        </form>
    </main>
</body>
</html>
