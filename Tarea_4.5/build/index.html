<!doctype html><html><head><title>Stopwatch</title><style>body{background:#ffa600;font-family:HelveticaNeue-Light,"Helvetica Neue Light","Helvetica Neue",Helvetica,Arial,"Lucida Grande",sans-serif;height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}h1{font-family:Roboto,sans-serif;font-weight:100;font-size:2.6em;text-transform:uppercase}#display{font-size:2em}button{background:#ffa600;color:#fff;border:2px solid #fff;border-radius:5px;font-size:1.2em;padding:18px 10px;width:180px;margin:10px;outline:0;cursor:pointer;transition:background .5s ease-in-out}button:hover{background:#fff;color:#ffa600}.buttons{display:flex;justify-content:center;align-items:center;gap:10px}</style></head><body><h1>Stopwatch</h1><p id="display">0.00</p><div class="buttons"><button id="start">Start</button> <button id="stop" disabled="disabled">Stop</button> <button id="reset">Reset</button></div><script defer="defer" src="./transpilado.js"></script></body></html>
