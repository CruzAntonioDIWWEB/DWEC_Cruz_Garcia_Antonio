<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGAEA - Gestión Académica</title>
    <link rel="stylesheet" href="">
</head>
<body>
    <header>
        <h1>SGAEA - Gestión Académica</h1>
    </header>

    <main>
        <section id="formulario-estudiante">
            <h2>Registro de Estudiantes</h2>
            <form id="registro-form">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>

                <label for="edad">Edad:</label>
                <input type="number" id="edad" min="1" required>

                <fieldset>
                    <legend>Dirección</legend>
                    <label for="calle">Calle:</label>
                    <input type="text" id="calle" required>

                    <label for="numero">Número:</label>
                    <input type="number" id="numero" required>

                    <label for="piso">Piso:</label>
                    <input type="text" id="piso">
                </fieldset>

                <button type="submit">Registrar</button>
            </form>
        </section>

        <section id="lista-estudiantes">
            <h2>Lista de Estudiantes</h2>
            <ul id="estudiantes-list"></ul>
        </section>
    </main>

    <script src="/js/eventos.js" type="module"></script>
</body>
</html>
